[project]
name = "dealfinder"
version = "0.1.0"
description = "Self-hosted Facebook Marketplace furniture-deal finder with AI valuation"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately small. The pipeline runs on GitHub Actions with the stdlib for HTTP,
# JSON files for state, and a generated static page for the UI — so there is no web
# framework, no ORM and no browser driver to install. `anthropic` is only needed if you
# switch the appraiser to the metered API instead of your Claude subscription.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
dealfinder-board = "dealfinder.run_board:main"
dealfinder-negotiate = "dealfinder.negotiate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
