[project]
name = "dealfinder"
version = "0.1.0"
description = "EBTH auction watch: AI valuation, resale pricing and max-bid math"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately small. The pipeline runs on GitHub Actions with the stdlib for HTTP,
# JSON files for state, and a generated static page for the UI — so there is no web
# framework, no ORM and no browser driver to install.
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
# The metered-API path. The default (subscription) path shells out to the Claude Code
# CLI and needs neither of these — installing them on every scheduled Actions run for a
# code path that never executes was pure waste.
api = [
    "anthropic>=0.40",
    "pydantic-settings>=2.6",
]
# The auction source. ebth.com serves no data in its HTML, so its lots are only
# reachable by running the site's own application.
browser = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.3",
    "dealfinder[api]",
]

[project.scripts]
dealfinder-auctions = "dealfinder.run_auctions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
