[project]
name = "dealfinder"
version = "0.1.0"
description = "Self-hosted Facebook Marketplace furniture-deal finder with AI valuation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "patchright>=1.48",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
dealfinder-web = "dealfinder.web.run:main"
dealfinder-worker = "dealfinder.worker.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
