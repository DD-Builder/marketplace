name: Draft a negotiation reply

# Dispatched by the board's negotiation panel. Writes .drafts/<listing-id>.json,
# which the page is polling for (via the Contents API, so it does not need to be
# under the published docs/ tree — pasted seller conversations shouldn't be served
# as public web pages). Nothing is ever sent to a seller — you read the drafts,
# edit one, and send it yourself.
on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "Marketplace listing id (from the board card)"
        required: true
      posture:
        description: "0 = lowball and ready to walk, 100 = pay asking today"
        required: false
        default: "40"
      conversation:
        description: "The thread so far, most recent message last"
        required: false
        default: ""
      notes:
        description: "Condition flaws or other leverage"
        required: false
        default: ""

permissions:
  contents: write

# Two people drafting at once would race on the commit. Queue instead of cancelling,
# so nobody's drafts are silently thrown away.
concurrency:
  group: negotiate
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inputs travel through the environment, never interpolated into a shell command:
    # a seller's message containing a quote or a backtick would otherwise break the
    # command, or worse.
    env:
      LISTING_ID: ${{ inputs.listing_id }}
      POSTURE: ${{ inputs.posture }}
      CONVERSATION: ${{ inputs.conversation }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app
        run: pip install -e '.[api]'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft the reply
        env:
          # Same provider switch as the deal board: the APPRAISER_PROVIDER repository
          # variable set to claude-api routes drafting through the metered API instead.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPRAISER_PROVIDER: ${{ vars.APPRAISER_PROVIDER || 'claude-code' }}
          NEGOTIATION_MODEL: ${{ vars.NEGOTIATION_MODEL }}
          HOURLY_RATE_CENTS: ${{ vars.HOURLY_RATE_CENTS }}
        run: |
          python -m dealfinder.negotiate \
            --listing-id "$LISTING_ID" \
            --posture "$POSTURE" \
            --conversation "$CONVERSATION" \
            --notes "$NOTES" \
            --catalog docs/catalog.json \
            --pieces docs/pieces.json \
            --out .drafts
        # An error is written to the drafts file too, so the page shows the reason
        # instead of polling forever.
        continue-on-error: true

      - name: Publish the drafts
        run: |
          git config user.name "deal-board"
          git config user.email "deal-board@users.noreply.github.com"
          # The draft step may have crashed before creating the directory; an empty
          # add must not fail the publish (the page relies on *something* landing).
          mkdir -p .drafts
          bash .github/scripts/publish.sh "Negotiation drafts [skip ci]" .drafts
