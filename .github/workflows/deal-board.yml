name: Deal board

# Runs the whole pipeline on GitHub's free compute and publishes the board to
# GitHub Pages. Trigger it from the GitHub app on your iPad (Actions -> Deal board
# -> Run workflow), or let the schedule fire it.
on:
  workflow_dispatch:
    inputs:
      max_appraisals:
        description: "Hard cap on AI valuations this run (cost control)"
        required: false
        default: ""
      dry_run:
        description: "Skip AI entirely (free pre-screen only)"
        type: boolean
        required: false
        default: false
      recover:
        description: "Re-read past Apify runs instead of scraping (costs no credit)"
        type: boolean
        required: false
        default: false
  schedule:
    # Daily, ~8-9am Eastern. Counter-intuitively daily is the *cheap* cadence: measured
    # on a real export, a daily re-run finds ~30% new listings and ~70% already seen, and
    # the two-stage scrape only pays for the 30%. Twice a week means a bigger new-fraction
    # each time for the same index cost.
    #
    # :17 rather than :00 — GitHub's scheduler is heavily congested on the hour, where
    # runs are routinely delayed 10-30 minutes and are sometimes dropped outright.
    - cron: "17 13 * * *"

# Let the job commit the regenerated site back to the branch.
permissions:
  contents: write

concurrency:
  group: deal-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app
        # [api] pulls the metered-path SDK too, so switching provider is one variable.
        run: pip install -e '.[api]'

      - name: Install Claude Code
        if: ${{ !inputs.dry_run }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the pipeline
        env:
          # Provider: claude-code bills your Max subscription via the CLI (needs the
          # OAuth token). Set the APPRAISER_PROVIDER repository VARIABLE to claude-api
          # to pay per token with an ANTHROPIC_API_KEY secret instead — the escape
          # hatch for when the OAuth token can't be minted from the device you're on.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPRAISER_PROVIDER: ${{ vars.APPRAISER_PROVIDER || 'claude-code' }}
          APPRAISE_MODEL: ${{ vars.APPRAISE_MODEL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Optional: free eBay Browse API (~5,000 calls/day) supplies comparable asking
          # prices so the appraiser has market data instead of estimating unaided.
          # Absent, comps are simply skipped and behaviour is unchanged.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SEARCH_URLS: ${{ vars.SEARCH_URLS }}
          REGION_LABEL: ${{ vars.REGION_LABEL }}
          IN_RADIUS_TOWNS: ${{ vars.IN_RADIUS_TOWNS }}
          RESULTS_LIMIT: ${{ vars.RESULTS_LIMIT }}
          # Pushed into the Marketplace search URL, so listings you'd never buy are
          # never billed. All optional — unset means no filter.
          MIN_PRICE_DOLLARS: ${{ vars.MIN_PRICE_DOLLARS }}
          MAX_PRICE_DOLLARS: ${{ vars.MAX_PRICE_DOLLARS }}
          DAYS_SINCE_LISTED: ${{ vars.DAYS_SINCE_LISTED }}
          SEARCH_RADIUS_KM: ${{ vars.SEARCH_RADIUS_KM }}
          # The actor that scrapes, and the one used for detail pages if the main
          # one can't. APIFY_ACTOR also scopes --recover to this actor's past runs.
          APIFY_ACTOR: ${{ vars.APIFY_ACTOR }}
          APIFY_DETAIL_ACTOR: ${{ vars.APIFY_DETAIL_ACTOR }}
          HOURLY_RATE_CENTS: ${{ vars.HOURLY_RATE_CENTS }}
          # Manual input wins, then the repository variable, then the code default.
          MAX_APPRAISALS: ${{ inputs.max_appraisals || vars.MAX_APPRAISALS }}
          WILDCARDS: ${{ vars.WILDCARDS }}
          MAX_CARDS: ${{ vars.MAX_CARDS }}
          MAX_PHOTO_BACKFILL: ${{ vars.MAX_PHOTO_BACKFILL }}
          VERTICAL: ${{ vars.VERTICAL }}
          DRAFTS_DIR: .drafts
          # Booleans reach the script through env, never inline interpolation —
          # same reasoning as negotiate.yml: nothing user-typed touches the shell.
          RECOVER: ${{ inputs.recover }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          [ "$RECOVER" = "true" ] && ARGS="$ARGS --recover"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          python -m dealfinder.run_board \
            --out docs \
            --catalog docs/catalog.json \
            --pieces docs/pieces.json \
            $ARGS

      - name: Publish the board
        # A run that exits 4 (appraisals failed) or 5 (scrape blocked) has still
        # rebuilt the board and updated the catalogue — that work must reach the
        # branch or the site silently goes stale and paid-for scrape data is lost.
        # Exits 2/3 return before touching any state, so publishing is always safe.
        if: ${{ !cancelled() }}
        run: |
          # Working photos are an intermediate; only the cover images ship with the site.
          rm -rf docs/_photos
          git config user.name "deal-board"
          git config user.email "deal-board@users.noreply.github.com"
          # Another workflow (negotiate) or a board button may have pushed while this
          # ran. docs/ is regenerated from scratch every run, so the publish helper
          # rewinds onto whatever landed and lays this board back down whole — rebasing
          # it conflicts on all three generated files and strands the repo mid-rebase.
          bash .github/scripts/publish.sh "Update deal board [skip ci]" docs
