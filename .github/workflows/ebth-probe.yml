name: EBTH structure probe

# Fires when the probe marker is touched. This exists because the GitHub App driving
# development can't call workflow_dispatch (403) — pushing a marker file is the
# API-tokenless way to ask a runner (which, unlike the dev sandbox, can reach ebth.com)
# what the site actually serves. The report lands in docs/auctions/probe.json.
on:
  push:
    paths:
      - ".github/probe-request"

permissions:
  contents: write

concurrency:
  group: ebth-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app
        run: pip install -e '.[browser]'
      - name: Install Chromium for Playwright
        # Occasionally the apt-based --with-deps install stalls on a slow mirror; a
        # run was lost this way, burning the whole 10-minute job budget on this one
        # step. A tight step-level timeout fails it fast with a clear signal instead.
        timeout-minutes: 6
        run: python -m playwright install --with-deps chromium
      - name: Probe ebth.com
        # A step-level budget under the job's, so an over-running probe fails with a
        # signal and the publish step still runs. Without one, a probe that hung ate the
        # whole job clock and the publish step was skipped, so a run that had already
        # gathered most of its evidence shipped nothing.
        timeout-minutes: 16
        env:
          EBTH_SEARCH_URLS: ${{ vars.EBTH_SEARCH_URLS }}
          EBTH_FETCH: ${{ vars.EBTH_FETCH || 'browser' }}
        run: |
          python -u -m dealfinder.run_auctions --probe \
            --out docs/auctions --catalog docs/auctions/catalog.json || true
      - name: Publish the report
        # always(), because the point of a probe is the evidence it gathered. `|| true`
        # covers a probe that exits non-zero but not one the step timeout kills — and
        # that is precisely the case that lost a whole run's findings.
        if: always()
        run: |
          git config user.name "ebth-probe"
          git config user.email "ebth-probe@users.noreply.github.com"
          bash .github/scripts/publish.sh "EBTH structure probe [skip ci]" docs/auctions/probe.json
